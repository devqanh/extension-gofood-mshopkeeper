<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoFood VietQR</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>GoFood VietQR</h1>
        <p>Chọn chi nhánh nhận chuyển khoản mặc định.</p>
      </header>

      <div class="button-row">
        <button id="load-api" class="button" type="button">Tải chi nhánh</button>
        <button id="save" class="button secondary" type="button">Lưu</button>
      </div>

      <label class="field">
        <span>Chi nhánh mặc định</span>
        <select id="bank-select"></select>
      </label>

      <div id="bank-info" class="bank-info">Chưa có dữ liệu ngân hàng.</div>
      <div id="status" class="status" role="status"></div>

    </main>

    <script src="api-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
